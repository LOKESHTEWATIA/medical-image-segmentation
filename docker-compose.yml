# MedSeg - Medical Image Segmentation Platform
# Docker Compose for development and production

version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: medseg-postgres
    environment:
      POSTGRES_DB: medseg
      POSTGRES_USER: medseg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medseg -d medseg"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - medseg-network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # Redis for caching, sessions, Celery
  redis:
    image: redis:7-alpine
    container_name: medseg-redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - medseg-network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: medseg-backend
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://medseg:${POSTGRES_PASSWORD:-changeme}@postgres:5432/medseg
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://medseg.local}
      - UPLOAD_DIR=/app/uploads
      - MODEL_DIR=/app/models
      - DEVICE=cuda
      - LOG_LEVEL=INFO
    volumes:
      - upload_data:/app/uploads
      - model_data:/app/models
      - ./backend:/app:ro  # For development, remove in production
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - medseg-network
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    # GPU support for inference
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Celery Worker for inference
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: medseg-celery-worker
    command: celery -A app.tasks.inference worker --loglevel=info --concurrency=1 --pool=solo -Q inference
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://medseg:${POSTGRES_PASSWORD:-changeme}@postgres:5432/medseg
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - SECRET_KEY=${SECRET_KEY}
      - UPLOAD_DIR=/app/uploads
      - MODEL_DIR=/app/models
      - DEVICE=cuda
      - LOG_LEVEL=INFO
    volumes:
      - upload_data:/app/uploads
      - model_data:/app/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - medseg-network
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Celery Beat for scheduled tasks
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: medseg-celery-beat
    command: celery -A app.tasks.inference beat --loglevel=info --scheduler celery.beat.PersistentScheduler
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://medseg:${POSTGRES_PASSWORD:-changeme}@postgres:5432/medseg
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - SECRET_KEY=${SECRET_KEY}
    volumes:
      - ./celerybeat-schedule:/app/celerybeat-schedule
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - medseg-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Flower for Celery monitoring
  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: medseg-flower
    command: celery -A app.tasks.inference flower --port=5555 --basic_auth=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-changeme}
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - medseg-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Frontend (React)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: medseg-frontend
    environment:
      - VITE_API_URL=https://medseg.local/api/v1
      - VITE_WS_URL=wss://medseg.local/ws
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - medseg-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: medseg-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - backend
      - frontend
    networks:
      - medseg-network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

volumes:
  postgres_data:
  redis_data:
  upload_data:
  model_data:

networks:
  medseg-network:
    driver: bridge